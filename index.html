<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Halloween Costume Idea</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #ff6600;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      padding: 50px;
    }
    h1 {
      font-size: 3em;
      text-shadow: 2px 2px #000;
    }
    .costume-card {
      background-color: #2b2b2b;
      border: 2px solid #ff6600;
      border-radius: 10px;
      max-width: 400px;
      margin: 20px auto;
      padding: 20px;
      box-shadow: 0 0 15px rgba(255, 102, 0, 0.5);
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      margin: 10px 0;
      color: #fff;
    }
  </style>
</head>
<body>

  <h1> Check Out These Costumes </h1>
  
  <div class="costume-card">
    <h2>Spooky Vampire Lord</h2>
    <p><strong>Status:</strong> Work in Progress</p>
    <h3>What You Need:</h3>
    <ul>
      <li>🦇 Black velvet cape</li>
      <li>🧛 Faux-fang teeth</li>
      <li>🩸 Pale face paint</li>
      <li>🎩 Top hat and cane</li>
    </ul>
  </div>

</body>
</html>
